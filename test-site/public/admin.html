<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Test Controls</title><link rel="stylesheet" href="/styles.css"></head><body><header><h1>Reservation Test Site - Admin</h1><nav id="nav"></nav></header><main id="adminPage" class="container"><div class="card"><h2>Test Controls</h2><p>Use these controls to make monitor testing deterministic without waiting for the 30-second timer.</p><div class="test-controls"><button id="openRandom" class="primary">Open Random Cells</button><button id="reset" class="secondary">Reset Grid</button><button id="clearLog" class="secondary">Clear Log</button><input id="cellNumber" type="number" min="1" max="40" placeholder="Cell #"><button id="openCell" class="secondary">Open Cell</button><button id="closeCell" class="secondary">Close Cell</button></div><div id="adminMessage" class="status" style="margin-top:12px"></div></div><div class="card"><h2>Current Grid</h2><div id="cycleInfo" class="status"></div><div id="grid" class="grid"></div></div><div class="card"><h2>Reservation Log</h2><table class="log-table"><thead><tr><th>Cell</th><th>User</th><th>Opened</th><th>Reserved</th><th>Open duration</th></tr></thead><tbody id="logBody"></tbody></table></div></main><script src="/app.js"></script></body></html>
