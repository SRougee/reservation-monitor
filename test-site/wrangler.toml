name = "reservation-monitor-test"
main = "./worker/index.js"
compatibility_date = "2026-09-11"

# Cloudflare Workers Static Assets
# IMPORTANT: this path is relative to THIS wrangler.toml file.
# All browser-facing website files live under test-site/public/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# D1 database binding used by worker/index.js as env.DB.
[[d1_databases]]
binding = "DB"
database_name = "reservation-monitor-test"
database_id = "2572f735-698e-4aba-babe-37aaeb38ef63"
